model:
  name: "TinyLlama/TinyLlama-1.1B-intermediate-step-1431k-3T"
  dtype: "bfloat16"
  trust_remote_code: true
  use_liger_kernel: false

data:
  # To be overridden by ml_engine.py
  name: "dummy"
  tokenized_path: "dummy"
  seq_len: 512
  format: "chatml"

lora:
  enabled: false
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: ["q_proj", "v_proj"]

training:
  batch_size: 4
  grad_accum: 2
  lr: 2e-4
  max_steps: 10
  distributed:
    strategy: "ddp"

checkpoint:
  # To be overridden by ml_engine.py
  save_dir: "dummy"
  save_interval: 5
  keep_last_n: 1

logging:
  tracker: "none"
